# Vexora IT Solutions - Upptime Configuration

# GitHub Details
owner: vexoraitsolution # Your GitHub Organization or Username
repo: status-page       # The name of your GitHub repository

# Endpoints to Monitor
sites:
  - name: Vexora Main Website
    url: https://vexorait.com

# Public Status Page Settings
status-website:
  cname: status.vexorait.com # Custom Domain CNAME
  logoUrl: https://vexorait.com/assets/logo.png
  faviconUrl: https://vexorait.com/assets/favicon.ico
  name: Vexora System Status
  
  introTitle: "**Vexora Systems & API Live Status**"
  introMessage: Welcome to the official real-time status page for **Vexora IT Solutions**. Here you can monitor the uptime, response times, and incident reports for our API Gateways and core infrastructure.
  
  # Navigation Bar Links
  navbar:
    - title: Status
      href: /
    - title: Main Website
      href: https://vexorait.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  # 🎨 Custom Vexora Theme & 0-Watermark CSS
  customCSS: |
    /* Hide Upptime Watermark Footer */
    footer, .footer, p:has(a[href*="upptime"]) {
      display: none !important;
    }

    /* Vexora Dark Theme Background & Fonts */
    body {
      background-color: #0b0f19 !important;
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      color: #e2e8f0 !important;
    }

    /* Cards & Containers */
    .card, div[aria-label*="Status"], div[class*="Box"] {
      background-color: #111827 !important;
      border: 1px solid #1f2937 !important;
      border-radius: 10px !important;
    }

    /* Navigation Bar */
    nav, header {
      background-color: #0d1527 !important;
      border-bottom: 1px solid #1f2937 !important;
    }

    /* Active & Hover Navigation Links */
    nav a {
      color: #94a3b8 !important;
    }
    nav a:hover, nav a[aria-current="page"] {
      color: #38bdf8 !important;
    }
